provider:
  name: pihole
policy: upsert-only
txtOwnerId: "homelab"
env:
  - name: EXTERNAL_DNS_PIHOLE_SERVER
    value: http://pihole-web.pihole-system.svc.cluster.local
  - name: EXTERNAL_DNS_PIHOLE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: pihole-password
        key: password
sources:
  - gateway-httproute
  # - gateway-tlsroute
  # - gateway-udproute
  # - gateway-tcproute
  # - gateway-grpcroute
  - traefik-proxy
  - service
  - ingress
serviceAccount:
  create: true
  name: "external-dns"
ingressClassFilters:
  - traefik