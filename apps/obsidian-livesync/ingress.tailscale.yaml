apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: obsidian-livesync
  namespace: obsidian
  annotations:
    tailscale.com/proxy-group: ingress-proxies
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - obsidian
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # The chart's other service is headless, which the proxy rejects.
                name: couchdb-svc-couchdb
                port:
                  number: 5984