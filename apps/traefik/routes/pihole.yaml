apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  annotations:
    external-dns.alpha.kubernetes.io/target: traefik.homelab.redback.dev
  name: pihole
  namespace: traefik-system
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`pihole.homelab.redback.dev`)
    middlewares:
      - name: oauth2-errors
      - name: oauth2-auth
      - name: pihole-redirect-admin
    services:
    - name: pihole-web
      namespace: pihole-system
      port: 80
  tls:
    certResolver: le
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pihole-redirect-admin
  namespace: traefik-system
spec:
  redirectRegex:
    regex: ^https?://([^/]+)/?$
    replacement: https://${1}/admin