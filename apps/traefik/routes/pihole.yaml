apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  annotations:
    external-dns.alpha.kubernetes.io/target: traefik.homelab.redback.dev
  name: pihole
  namespace: traefik-system
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`pihole.homelab.redback.dev`)
    middlewares:
      - name: oauth2-errors
      - name: oauth2-auth
    services:
    - name: pihole-web
      namespace: pihole-system
      port: 80
  tls:
    certResolver: le