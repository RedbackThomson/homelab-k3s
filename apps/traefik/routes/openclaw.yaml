apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  annotations:
    external-dns.alpha.kubernetes.io/target: traefik.homelab.redback.dev
  name: openclaw
  namespace: traefik-system
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`openclaw.homelab.redback.dev`)
    services:
    - name: openclaw-external
      namespace: traefik-system
      port: 18789
  tls: {}
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-external
  namespace: traefik-system
spec:
  type: ExternalName
  externalName: 192.168.1.153 # openclaw.homelab.local
  ports:
    - name: web
      port: 18789
      targetPort: 18789