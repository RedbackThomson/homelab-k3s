apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hass
  namespace: traefik-system
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`hass.homelab.redback.dev`)
    services:
    - name: hass-external
      namespace: traefik-system
      port: 8123
  tls: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hass-external
  namespace: traefik-system
spec:
  type: ExternalName
  externalName: 192.168.3.152 # hass.homelab.local
  ports:
    - name: web
      port: 8123
      targetPort: 8123