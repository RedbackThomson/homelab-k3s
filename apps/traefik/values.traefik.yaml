providers:
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true
  kubernetesCRD:
    enabled: true
    # hass routes to an ExternalName service on the LAN, in this namespace.
    allowExternalNameServices: true
    allowCrossNamespace: false
  kubernetesGateway:
    enabled: false

gateway:
  enabled: false

api:
  dashboard: true
  # Serves the dashboard on the traefik entrypoint, which is only reachable
  # through the tailnet ingress below and never from the LoadBalancer.
  insecure: true

ingressRoute:
  dashboard:
    enabled: false

ingressClass:
  enabled: true
  isDefaultClass: true

service:
  # Pinned so the WAN forward has a target that survives pool changes.
  spec:
    loadBalancerIP: 192.168.3.222
  # Keeps the dashboard port off the LoadBalancer, which the WAN forwards to.
  additionalServices:
    dashboard:
      type: ClusterIP

ports:
  traefik:
    expose:
      dashboard: true
  web:
    port: 80
  websecure:
    port: 443
    http:
      # Wildcard for *.homelab.redback.dev; inherited by routes with empty tls: {}
      tls:
        enabled: true
        certResolver: le
        domains:
          - main: homelab.redback.dev
            sans:
              - "*.homelab.redback.dev"

# Persist acme.json across pod restarts to avoid LE rate limits
persistence:
  enabled: true
  size: 128Mi
  accessMode: ReadWriteOnce
  path: /data

# Make /data writable by non-root traefik (uid 65532) and pre-create acme.json
deployment:
  initContainers:
    - name: volume-permissions
      image: busybox:latest
      command: ["sh", "-c", "touch /data/acme.json; chmod -v 600 /data/acme.json"]
      volumeMounts:
        - mountPath: /data
          name: data
podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch

# Cloudflare API token for DNS-01 challenge (Zone:Read + DNS:Edit on redback.dev)
env:
  - name: CF_DNS_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: token

certificatesResolvers:
  le:
    acme:
      email: nick@redback.dev
      storage: /data/acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - 1.1.1.1:53
          - 1.0.0.1:53