providers:
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true
  kubernetesCRD:
    enabled: true
    allowExternalNameServices: true
    allowCrossNamespace: true
  kubernetesGateway:
    enabled: false

gateway:
  enabled: false

api:
  dashboard: true
  insecure: false

ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik-dashboard.homelab.redback.dev`)
    annotations:
      external-dns.alpha.kubernetes.io/target: traefik.homelab.redback.dev
    entryPoints:
      - websecure
    middlewares:
      - name: oauth2-errors
      - name: oauth2-auth
    # certResolver here because the reserved name "default" can't be used in tls.options
    tls:
      certResolver: le

ingressClass:
  enabled: true
  isDefaultClass: true

ports:
  web:
    port: 80
  websecure:
    port: 443
    # Wildcard for *.homelab.redback.dev; inherited by routes with empty tls: {}
    tls:
      enabled: true
      certResolver: le
      domains:
        - main: homelab.redback.dev
          sans:
            - "*.homelab.redback.dev"

# Persist acme.json across pod restarts to avoid LE rate limits
persistence:
  enabled: true
  size: 128Mi
  accessMode: ReadWriteOnce
  path: /data

# Make /data writable by non-root traefik (uid 65532) and pre-create acme.json
deployment:
  initContainers:
    - name: volume-permissions
      image: busybox:latest
      command: ["sh", "-c", "touch /data/acme.json; chmod -v 600 /data/acme.json"]
      volumeMounts:
        - mountPath: /data
          name: data
podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch

# Cloudflare API token for DNS-01 challenge (Zone:Read + DNS:Edit on redback.dev)
env:
  - name: CF_DNS_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: token

certificatesResolvers:
  le:
    acme:
      email: nick@redback.dev
      storage: /data/acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - 1.1.1.1:53
          - 1.0.0.1:53