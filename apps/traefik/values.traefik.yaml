# Use Ingress/IngressRoute (not Gateway API)
providers:
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true
  kubernetesCRD:
    enabled: true
  kubernetesGateway:
    enabled: false

# Turn off the Gateway API chart-managed Gateway/listeners
gateway:
  enabled: false

api:
  dashboard: true
  insecure: false

# Expose dashboard via Traefik IngressRoute + ACME
ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik-dashboard.homelab.redback.dev`)
    annotations:
      external-dns.alpha.kubernetes.io/target: traefik.homelab.redback.dev
    entryPoints:
      - websecure
    middlewares:
      - name: oauth2-errors
      - name: oauth2-auth
    tls:
      certResolver: le

ingressClass:
  enabled: true
  isDefaultClass: true

ports:
  web:
    port: 80
  websecure:
    port: 443


# tlsChallenge is not working with the current version of the chart, so 
# we're using additionalArguments to set the tlschallenge flag.
additionalArguments:
  - --certificatesresolvers.le.acme.email=nick@redback.dev
  - --certificatesresolvers.le.acme.storage=/data/acme.json
  - --certificatesresolvers.le.acme.tlschallenge=true