# Use Ingress/IngressRoute (not Gateway API)
providers:
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true
  kubernetesCRD:
    enabled: true
    allowExternalNameServices: true
    allowCrossNamespace: true
  kubernetesGateway:
    enabled: false

# Turn off the Gateway API chart-managed Gateway/listeners
gateway:
  enabled: false

api:
  dashboard: true
  insecure: false

# Expose dashboard via Traefik IngressRoute + ACME
ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik-dashboard.homelab.redback.dev`)
    annotations:
      external-dns.alpha.kubernetes.io/target: traefik.homelab.redback.dev
    entryPoints:
      - websecure
    middlewares:
      - name: oauth2-errors
      - name: oauth2-auth
    tls:
      certResolver: le

ingressClass:
  enabled: true
  isDefaultClass: true

ports:
  web:
    port: 80
  websecure:
    port: 443

# Persist /data so acme.json (issued certs + account key) survives pod restarts.
# Without this we re-hit Let's Encrypt on every restart and risk rate limits.
persistence:
  enabled: true
  size: 128Mi
  accessMode: ReadWriteOnce
  path: /data

# Traefik runs as uid/gid 65532. Init container creates acme.json with mode 600
# so lego can write to it; fsGroup makes the mounted PVC writable by that uid.
deployment:
  initContainers:
    - name: volume-permissions
      image: busybox:latest
      command: ["sh", "-c", "touch /data/acme.json; chmod -v 600 /data/acme.json"]
      volumeMounts:
        - mountPath: /data
          name: data
podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch

# DNS-01 via Cloudflare. Requires a `cloudflare-api-token` Secret in
# traefik-system with key `token` containing a CF API token scoped to
# Zone:Read + DNS:Edit on redback.dev. Create with:
#   kubectl create secret generic cloudflare-api-token \
#     -n traefik-system --from-literal=token=<TOKEN>
env:
  - name: CF_DNS_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: token

certificatesResolvers:
  le:
    acme:
      email: nick@redback.dev
      storage: /data/acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - 1.1.1.1:53
          - 1.0.0.1:53